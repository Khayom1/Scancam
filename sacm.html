<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pinch-to-Zoom 3D бо MediaPipe Hands ва Three.js</title>
    <style>
        /* Тамоми саҳифаро пӯшонем */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
            font-size: 18px;
            z-index: 10;
            background: rgba(0,0,0,0.4);
            padding: 8px 0;
            backdrop-filter: blur(4px);
            border-radius: 30px;
            width: fit-content;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            bottom: 30px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #info span {
            font-weight: bold;
            color: #aaffaa;
        }
        /* Видео-камера дар пасзамина бо шаффофият барои дидани 3D */
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.3;
            transform: scaleX(-1); /* Барои акси оинаӣ */
        }
        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        /* Canvas-и Three.js дар боло */
        #three-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        /* Нишондиҳандаи ҳолат */
        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #0f0;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 20;
            backdrop-filter: blur(4px);
            border: 1px solid #0f0;
            box-shadow: 0 0 15px rgba(0,255,0,0.2);
            pointer-events: none;
        }
        @media (max-width: 600px) {
            #info { font-size: 14px; padding: 6px 14px; bottom: 20px; }
            #status { font-size: 12px; padding: 4px 12px; top: 12px; right: 12px; }
        }
    </style>
</head>
<body>

    <!-- Видео камера (барои намоиш, ғайрифаъол) -->
    <div id="video-container">
        <video id="webcam" playsinline></video>
    </div>

    <!-- Контейнер барои Three.js -->
    <div id="three-container"></div>

    <!-- Статус ва роҳнамо -->
    <div id="status">🖐️ Интизорӣ ба камера...</div>
    <div id="info">👌 <span>Пинч</span> байни ангушти шаҳодат ва калон → Андозаи 3D</div>

    <!-- Боркунии китобхонаҳо аз CDN -->
    <!-- MediaPipe Hands ва зависимосҳо -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029078/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js" crossorigin="anonymous"></script>
    
    <!-- Three.js ва дополнителӣ барои контрол (орӣ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        (function() {
            // --- 1. Танзими Three.js ---
            const container = document.getElementById('three-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122); // торанг барои зебоӣ

            // Камераи Three.js (Perspective)
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(3, 2, 5);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = false; // барои сабуктар
            container.appendChild(renderer.domElement);

            // Нурҳо барои 3D
            // Нури муҳит
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);

            // Нури асосӣ
            const mainLight = new THREE.DirectionalLight(0xffffff, 1);
            mainLight.position.set(2, 5, 3);
            scene.add(mainLight);

            // Нури пуркунанда
            const fillLight = new THREE.DirectionalLight(0x88aaff, 0.6);
            fillLight.position.set(-2, 1, -3);
            scene.add(fillLight);

            // Нури паси
            const backLight = new THREE.PointLight(0x4466ff, 0.5);
            backLight.position.set(0, 0, -4);
            scene.add(backLight);

            // Объекти 3D - куб бо ранги тағйирёбанда
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({
                color: 0x3f8efc,
                roughness: 0.3,
                metalness: 0.1,
                emissive: new THREE.Color(0x1a3a6a),
                emissiveIntensity: 0.2
            });
            const cube = new THREE.Mesh(geometry, material);
            cube.castShadow = true;
            cube.receiveShadow = false;
            scene.add(cube);

            // Барои зебоӣ: чорчӯба ва нуқтаҳо
            const gridHelper = new THREE.GridHelper(3, 10, 0x88aaff, 0x445588);
            gridHelper.position.y = -0.8;
            scene.add(gridHelper);

            // Сфераи хурд барои ороиш
            const sphereGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const sphereMat = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0x442200 });
            for (let i = 0; i < 8; i++) {
                const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                const angle = (i / 8) * Math.PI * 2;
                sphere.position.set(Math.cos(angle)*1.6, -0.5, Math.sin(angle)*1.6);
                scene.add(sphere);
            }

            // --- 2. Танзими MediaPipe Hands ---
            const videoElement = document.getElementById('webcam');
            const statusDiv = document.getElementById('status');

            // Функсия барои ҳисоб кардани масофаи байни ду нуқта
            function distance(p1, p2) {
                return Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2 + (p1.z - p2.z) ** 2);
            }

            // Масофаи аввалия барои нормализатсия (калибр)
            let initialDistance = null;
            let currentScale = 1.0;
            const MIN_SCALE = 0.3;
            const MAX_SCALE = 2.8;

            // Функсияи коркарди натиҷаи MediaPipe
            function onResults(results) {
                // Агар даст пайдо шавад
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    // Мо танҳо дасти аввалро мегирем (агар ду даст бошад, дасти аввал)
                    const landmarks = results.multiHandLandmarks[0];
                    
                    // Индексҳо: 4 - ангушти калон (THUMB_TIP), 8 - ангушти шаҳодат (INDEX_FINGER_TIP)
                    const thumbTip = landmarks[4];
                    const indexTip = landmarks[8];
                    
                    if (thumbTip && indexTip) {
                        // Ҳисоби масофаи ҷорӣ
                        const dist = distance(thumbTip, indexTip);
                        
                        // Агар масофаи аввалия муайян нашуда бошад, онро танзим кун
                        if (initialDistance === null) {
                            initialDistance = dist;
                            statusDiv.innerHTML = '🤏 Пинч кунед (калон/хурд)';
                            statusDiv.style.color = '#0f0';
                        } else {
                            // Таносуби масофаи ҷорӣ ба масофаи аввалия
                            const ratio = dist / initialDistance;
                            
                            // Андозаи нав: андозаи аввалия * ratio, бо маҳдудкунӣ
                            let newScale = currentScale * ratio;
                            newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
                            
                            // Танзими андозаи куб
                            cube.scale.set(newScale, newScale, newScale);
                            
                            // Нигоҳ доштани андоза барои ҳаракати навбатӣ
                            currentScale = newScale;
                            
                            // Навсозии статус
                            statusDiv.innerHTML = `🔍 Андоза: ${newScale.toFixed(2)}x`;
                            statusDiv.style.color = '#aaffaa';
                            
                            // Барои калибрсозии доимӣ: initialDistance-ро ба қадри зарурӣ навсозӣ намекунем,
                            // то ки тағйирот ногаҳонӣ набошад. Аммо барои беҳтарин таҷриба, 
                            // мо метавонем initialDistance-ро бо суръати паст навсозем, 
                            // вале ин ҷо барои соддагӣ онро устувор нигоҳ медорем.
                        }
                    }
                } else {
                    // Агар даст набошад, статусро навсозӣ кун
                    statusDiv.innerHTML = '🖐️ Дастро нишон диҳед';
                    statusDiv.style.color = '#ffaa44';
                    // Агар даст гум шавад, initialDistance-ро баста кунем, то боз калибр шавад
                    initialDistance = null;
                }
            }

            // --- 3. Боркунии MediaPipe Hands ---
            const hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
                }
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onResults);

            // --- 4. Камера бо CameraUtils ---
            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480,
                facingMode: "user"  // Камераи пеши телефон ё веб-камера
            });
            cameraUtils.start().then(() => {
                statusDiv.innerHTML = '✅ Камера фаъол';
                statusDiv.style.color = '#0f0';
            }).catch((err) => {
                console.error("Хатогии камера:", err);
                statusDiv.innerHTML = '❌ Хатогии камера!';
                statusDiv.style.color = '#f44';
            });

            // --- 5. Андозагирии равшанӣ ва animations ---
            window.addEventListener('resize', onWindowResize, false);
            function onWindowResize() {
                const width = container.clientWidth;
                const height = container.clientHeight;
                renderer.setSize(width, height);
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            }

            // Аниматсияи гардиш барои зебоӣ
            function animate() {
                requestAnimationFrame(animate);
                
                // Гардиши оҳистаи куб
                cube.rotation.x += 0.003;
                cube.rotation.y += 0.007;
                
                // Ранги кубро вобаста ба андоза каме тағйир диҳем (танҳо барои зебоӣ)
                const hue = 0.6 + (currentScale - 0.5) * 0.15;
                cube.material.color.setHSL(hue, 0.8, 0.5);
                
                renderer.render(scene, camera);
            }
            animate();

            // Барои он ки агар камера кор накунад, ҳадди аққал куб намоён бошад
            // ва барои бозгашти initialDistance дар сурати гум шудани даст
            // ин кор дар худи onResults анҷом дода мешавад.

            // Илова барои дастгирии touch дар телефон
            console.log('Барнома омода! Pinch-to-Zoom тавассути MediaPipe ва Three.js');
        })();
    </script>
</body>
</html>
