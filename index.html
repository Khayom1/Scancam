
<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Futuristic Hand Zoom 3D</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #030712; font-family: 'Segoe UI', Roboto, sans-serif;
        }
        #webcam {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0.15; transform: scaleX(-1); z-index: 1; filter: grayscale(100%) contrast(150%);
        }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
        }
        #hud-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3;
            pointer-events: none;
        }
        #status {
            position: absolute; top: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.75); color: #38bdf8; padding: 10px 20px;
            border-radius: 30px; font-size: 14px; font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.3); backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }
        #info {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.75); color: #f8fafc;
            padding: 10px 24px; border-radius: 30px; font-size: 14px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px);
            letter-spacing: 0.5px;
        }
        #info span { color: #38bdf8; font-weight: bold; }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="webcam" playsinline webkit-playsinline autoplay muted></video>
    <div id="canvas-container"></div>
    <div id="hud-container">
        <div id="status">⚡ Интизори даст...</div>
        <div id="info">🖐️ <span>Пинчи мулоим</span> — Micro-Gesture Pinch Zoom</div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const videoElement = document.getElementById('webcam');

        // --- 1. Three.js Scene Setup (Futuristic UI) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.15);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Grid background effect
        const gridHelper = new THREE.GridHelper(10, 20, 0x38bdf8, 0x1e293b);
        gridHelper.position.y = -1.5;
        gridHelper.rotation.x = 0.2;
        scene.add(gridHelper);

        // Lights
        const pointLight = new THREE.PointLight(0x38bdf8, 2, 10);
        pointLight.position.set(2, 2, 2);
        scene.add(pointLight);

        const purpleLight = new THREE.PointLight(0xa855f7, 2, 10);
        purpleLight.position.set(-2, -2, 2);
        scene.add(purpleLight);

        scene.add(new THREE.AmbientLight(0x0f172a, 2));

        // Main Holographic Object Group
        const objectGroup = new THREE.Group();
        scene.add(objectGroup);

        // Inner glowing cube
        const innerGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
        const innerMat = new THREE.MeshStandardMaterial({
            color: 0x0284c7,
            roughness: 0.1,
            metalness: 0.8,
            wireframe: false
        });
        const innerCube = new THREE.Mesh(innerGeo, innerMat);
        objectGroup.add(innerCube);

        // Outer Cyber Wireframe
        const outerGeo = new THREE.BoxGeometry(1.3, 1.3, 1.3);
        const outerWire = new THREE.WireframeGeometry(outerGeo);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 2, transparent: true, opacity: 0.6 });
        const wireframeCube = new THREE.LineSegments(outerWire, lineMat);
        objectGroup.add(wireframeCube);

        // Particles surrounding object
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 60;
        const posArray = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i++) {
            posArray[i] = (Math.random() - 0.5) * 3;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMat = new THREE.PointsMaterial({ size: 0.03, color: 0x38bdf8, transparent: true, opacity: 0.8 });
        const particles = new THREE.Points(particleGeo, particleMat);
        objectGroup.add(particles);

        // Resize Event
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 2. LERP & Smooth Logic ---
        let targetScale = 1.0;
        let currentScale = 1.0;
        let targetPosX = 0, targetPosY = 0;
        let currentPosX = 0, currentPosY = 0;
        let isHandDetected = false;

        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        // --- 3. MediaPipe Tracking ---
        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                const hand = results.multiHandLandmarks[0];
                
                const thumb = hand[4];  // Thumb Tip
                const index = hand[8];  // Index Tip
                const wrist = hand[0];  // Wrist position for smooth hand tracking

                // Distance calculation for scale
                const dx = thumb.x - index.x;
                const dy = thumb.y - index.y;
                const dz = thumb.z - index.z;
                const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                // Sensitivity mapping (Micro-gestures adjustment)
                // Base dist normalized ~0.03 (close) to 0.25 (far pinch)
                const minDist = 0.03;
                const maxDist = 0.22;
                const clampedDist = Math.max(minDist, Math.min(maxDist, dist));
                
                // Scale target (smooth range between 0.4x and 3.0x)
                targetScale = 0.4 + ((clampedDist - minDist) / (maxDist - minDist)) * 2.6;

                // Position tracking (Object follows hand position smoothly)
                targetPosX = (0.5 - wrist.x) * 3;
                targetPosY = (0.5 - wrist.y) * 2;

                statusEl.innerText = `🔍 Андоза: ${currentScale.toFixed(2)}x`;
                statusEl.style.color = '#38bdf8';
                statusEl.style.borderColor = 'rgba(56, 189, 248, 0.6)';
            } else {
                isHandDetected = false;
                targetScale = 1.0;
                targetPosX = 0;
                targetPosY = 0;
                statusEl.innerText = '⚡ Интизори даст...';
                statusEl.style.color = '#f59e0b';
                statusEl.style.borderColor = 'rgba(245, 158, 11, 0.4)';
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1, // 1 - Барои санҷиши саҳеҳтари микро-ҳаракатҳо
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        // High FPS camera pipeline
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720,
            facingMode: "user"
        });

        cameraUtils.start();

        // --- 4. Render Loop (Smooth 120FPS Animation) ---
        function animate() {
            requestAnimationFrame(animate);

            // Smooth Interpolation (LERP) - 0.1 factor eliminates hand shaking
            currentScale = lerp(currentScale, targetScale, 0.08);
            currentPosX = lerp(currentPosX, targetPosX, 0.06);
            currentPosY = lerp(currentPosY, targetPosY, 0.06);

            // Apply scale & positions
            objectGroup.scale.set(currentScale, currentScale, currentScale);
            objectGroup.position.x = currentPosX;
            objectGroup.position.y = currentPosY;

            // Continuous rotation for visual effect
            innerCube.rotation.x += 0.005;
            innerCube.rotation.y += 0.01;
            wireframeCube.rotation.x -= 0.008;
            wireframeCube.rotation.y -= 0.005;
            particles.rotation.y += 0.002;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
