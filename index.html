<!doctype html>
<html lang="tg"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030712">
<meta name="description" content="ScanCam — real-time hand tracking and 3D gesture interaction in your browser.">
<title>VEYROST AURA v0.1.0 — Spatial Gesture Interface</title>
<meta name="application-version" content="0.1.0">
<style>
:root{color-scheme:dark;--bg:#030712;--panel:rgba(15,23,42,.82);--line:rgba(148,163,184,.2);--cyan:#38bdf8;--muted:#94a3b8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f8fafc}
#webcam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.12;filter:grayscale(1) contrast(1.25)}#stage{position:absolute;inset:0}
#hud{position:absolute;inset:0;z-index:2;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand,.status,.bottom,.controls{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 40px #0003}
.brand{padding:12px 15px;border-radius:16px}.brand strong{display:block;letter-spacing:.16em;font-size:13px}.brand small{color:var(--muted);font-size:11px}
.status{padding:10px 13px;border-radius:999px;font-size:12px;color:#fbbf24;max-width:55%;text-align:center}
.bottom{align-self:center;text-align:center;padding:12px 16px;border-radius:16px;max-width:min(560px,100%);font-size:13px;color:#cbd5e1}.bottom b{color:var(--cyan)}
.controls{pointer-events:auto;align-self:center;display:flex;gap:8px;padding:8px;border-radius:16px;margin-top:10px}
button{border:0;border-radius:11px;padding:11px 16px;font-weight:700;font-size:13px;cursor:pointer;color:#06111e;background:var(--cyan)}button.secondary{background:#1e293b;color:#e2e8f0;border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}
#error{display:none;position:absolute;z-index:4;left:16px;right:16px;top:50%;transform:translateY(-50%);margin:auto;max-width:480px;padding:18px;border:1px solid #f87171aa;border-radius:18px;background:#190d18f2;color:#fecaca;line-height:1.5;white-space:pre-line}
#metrics{position:absolute;left:16px;bottom:110px;color:#94a3b8;font:11px ui-monospace,monospace;z-index:2;pointer-events:none}#handOverlay{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}#gestureCursor{position:absolute;z-index:5;width:22px;height:22px;border:2px solid #67e8f9;border-radius:50%;box-shadow:0 0 18px #22d3ee;pointer-events:none;transform:translate(-50%,-50%);display:none}#gestureCursor.pinching{background:#22d3ee55;transform:translate(-50%,-50%) scale(.72)}.aura-tools{display:flex;gap:7px;justify-content:center;margin-top:8px;pointer-events:auto}.aura-tools button{background:#101c30;color:#c8f7ff;border:1px solid #155e75;font-size:11px;padding:8px 11px}
@media(max-width:520px){.brand{padding:10px 12px}.status{font-size:11px;padding:9px 10px}.controls{width:100%;justify-content:center}.controls button{flex:1;padding:12px 8px}.bottom{font-size:12px}}
</style>
</head><body>
<video id="webcam" playsinline muted autoplay aria-label="Camera preview"></video><div id="stage"></div><canvas id="handOverlay"></canvas><div id="gestureCursor"></div>
<div id="hud"><div class="top"><div class="brand"><strong>VEYROST AURA <span style="color:#38bdf8;font-size:10px">v0.1.0</span></strong><small>SPATIAL GESTURE INTERFACE</small></div><div id="status" class="status" role="status" aria-live="polite">● Камера хомӯш аст</div></div>
<div><div class="bottom">Курсорро бо ангушти ишоратӣ идора кунед. Pinch — интихоб; ҳаракати даст — идоракунии объекти 3D.</div><div class="controls"><button id="startBtn" type="button">Фаъол кардани камера</button><button id="stopBtn" class="secondary" type="button" disabled>Қатъ кардан</button></div><div class="aura-tools"><button type="button" data-gesture-action="reset">RESET OBJECT</button><button type="button" data-gesture-action="rotate">ROTATE ON/OFF</button></div></div></div>
<div id="metrics">FPS: — · HAND: — · ZOOM: 1.00×</div><div id="error" role="alert"></div>
<script src="./gesture-core.js"></script>
<script>
(() => {
"use strict";
const $=id=>document.getElementById(id),video=$("webcam"),statusEl=$("status"),errorEl=$("error"),startBtn=$("startBtn"),stopBtn=$("stopBtn"),metricsEl=$("metrics"),overlay=$("handOverlay"),overlayCtx=overlay.getContext("2d"),cursorEl=$("gestureCursor");
let renderer,scene,camera,objectGroup,innerCube,wireCube,particles,hands=null,stream=null,renderFrameId=0,processFrameId=0,processing=false,running=false,mediaPipeBase="https://cdn.jsdelivr.net/npm/@mediapipe/hands/",librariesPromise=null;
let lastInference=0,lastFpsTime=0,frameCount=0,fps=0,handSeenAt=0,lastUiUpdate=0;
let targetScale=1,currentScale=1,targetX=0,targetY=0,currentX=0,currentY=0;
const gestureEngine=new AuraGestureCore.GestureEngine();let pinchButton=null,rotating=true;
function setStatus(message,color){statusEl.textContent=message;statusEl.style.color=color||"#fbbf24"}
function showError(message){errorEl.textContent=message;errorEl.style.display="block";setStatus("● Хато","#f87171")}
function hideError(){errorEl.style.display="none"}
function lerp(a,b,t){return a+(b-a)*t}
function loadScript(url){return new Promise((resolve,reject)=>{const script=document.createElement("script");script.src=url;script.async=true;script.onload=()=>resolve();script.onerror=()=>{script.remove();reject(Error("Load failed: "+url))};document.head.appendChild(script)})}
async function loadFirst(candidates,ready){if(ready())return;let lastError;for(const url of candidates){try{await loadScript(url);if(ready())return}catch(error){lastError=error}}throw lastError||Error("Library load failed")}
function ensureLibraries(){if(librariesPromise)return librariesPromise;librariesPromise=(async()=>{
 await loadFirst(["https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js","https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js","https://unpkg.com/three@0.128.0/build/three.min.js"],()=>!!window.THREE);
 const bases=["https://cdn.jsdelivr.net/npm/@mediapipe/hands/","https://unpkg.com/@mediapipe/hands/"];let lastError;
 for(const base of bases){try{await loadScript(base+"hands.js");if(window.Hands){mediaPipeBase=base;break}}catch(error){lastError=error}}
 if(!window.Hands)throw lastError||Error("MediaPipe Hands failed to load");return true
})().catch(error=>{librariesPromise=null;throw error});return librariesPromise}
function initScene(){
 if(renderer)return;if(!window.THREE)throw Error("Three.js бор нашуд. Пайвасти интернетро санҷед.");
 const host=$("stage");scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030712,.12);
 camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.set(0,0,4.4);
 renderer=new THREE.WebGLRenderer({alpha:true,antialias:innerWidth>600,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;host.appendChild(renderer.domElement);resizeOverlay();
 const grid=new THREE.GridHelper(12,24,0x0ea5e9,0x1e293b);grid.position.y=-1.55;grid.rotation.x=.12;scene.add(grid);
 const blue=new THREE.PointLight(0x38bdf8,2.2,12);blue.position.set(2,2,3);scene.add(blue);
 const violet=new THREE.PointLight(0xa855f7,1.6,10);violet.position.set(-2,-2,2);scene.add(violet);scene.add(new THREE.AmbientLight(0xffffff,.65));
 objectGroup=new THREE.Group();scene.add(objectGroup);
 innerCube=new THREE.Mesh(new THREE.BoxGeometry(.9,.9,.9),new THREE.MeshStandardMaterial({color:0x0284c7,metalness:.65,roughness:.22}));objectGroup.add(innerCube);
 wireCube=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.35,1.35,1.35)),new THREE.LineBasicMaterial({color:0x38bdf8,transparent:true,opacity:.9}));objectGroup.add(wireCube);
 const count=70,positions=new Float32Array(count*3);for(let i=0;i<positions.length;i++)positions[i]=(Math.random()-.5)*3.2;
 const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(positions,3));
 particles=new THREE.Points(geo,new THREE.PointsMaterial({color:0x7dd3fc,size:.025,transparent:true,opacity:.8}));objectGroup.add(particles);
 renderer.domElement.addEventListener("webglcontextlost",onContextLost,false);renderer.domElement.addEventListener("webglcontextrestored",()=>location.reload(),false);addEventListener("resize",onResize,{passive:true});
}
function onResize(){resizeOverlay();if(!renderer||!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight)}
function onContextLost(e){e.preventDefault();stopCamera();showError("WebGL context қатъ шуд. Саҳифаро нав кунед.")}
function renderLoop(now){
 if(!renderer)return;renderFrameId=requestAnimationFrame(renderLoop);const dt=Math.min((now-(renderLoop.last||now))/1000,.05);renderLoop.last=now;
 const smoothing=1-Math.exp(-10*dt);currentScale=lerp(currentScale,targetScale,smoothing);currentX=lerp(currentX,targetX,smoothing);currentY=lerp(currentY,targetY,smoothing);
 objectGroup.scale.setScalar(currentScale);objectGroup.position.set(currentX,currentY,0);
 if(rotating){innerCube.rotation.x+=dt*.55;innerCube.rotation.y+=dt*.9;wireCube.rotation.x-=dt*.42;wireCube.rotation.y-=dt*.3;particles.rotation.y+=dt*.12;}renderer.render(scene,camera);
 frameCount++;if(now-lastFpsTime>=1000){fps=Math.round(frameCount*1000/(now-lastFpsTime));frameCount=0;lastFpsTime=now}
 if(now-lastUiUpdate>250){const detected=now-handSeenAt<800;metricsEl.textContent="FPS: "+fps+" · HAND: "+(detected?"DETECTED":"—")+" · ZOOM: "+currentScale.toFixed(2)+"×";if(running&&!detected&&now-handSeenAt>1000)setStatus("● Даст нишон диҳед","#fbbf24");lastUiUpdate=now}
}
function resizeOverlay(){const dpr=Math.min(devicePixelRatio||1,1.5);overlay.width=Math.round(innerWidth*dpr);overlay.height=Math.round(innerHeight*dpr);overlay.style.width=innerWidth+"px";overlay.style.height=innerHeight+"px";overlayCtx.setTransform(dpr,0,0,dpr,0,0)}
function drawHand(points){overlayCtx.clearRect(0,0,innerWidth,innerHeight);if(!points)return;overlayCtx.lineWidth=2;overlayCtx.strokeStyle="rgba(56,189,248,.9)";overlayCtx.fillStyle="#a5f3fc";for(const [a,b] of AuraGestureCore.CONNECTIONS){overlayCtx.beginPath();overlayCtx.moveTo((1-points[a].x)*innerWidth,points[a].y*innerHeight);overlayCtx.lineTo((1-points[b].x)*innerWidth,points[b].y*innerHeight);overlayCtx.stroke()}for(const p of points){overlayCtx.beginPath();overlayCtx.arc((1-p.x)*innerWidth,p.y*innerHeight,3,0,Math.PI*2);overlayCtx.fill()}}
function onResults(results){
 const list=results.multiHandLandmarks;if(!list||!list.length){const lost=gestureEngine.update(null);drawHand(null);if(lost.release){cursorEl.style.display="none";cursorEl.classList.remove("pinching");pinchButton=null}if(performance.now()-handSeenAt>250){targetScale=1;targetX=0;targetY=0}return}
 const hand=list[0],state=gestureEngine.update(hand);if(!state.valid)return;handSeenAt=performance.now();drawHand(hand);
 const x=state.cursor.x*innerWidth,y=state.cursor.y*innerHeight;cursorEl.style.display="block";cursorEl.style.left=x+"px";cursorEl.style.top=y+"px";cursorEl.classList.toggle("pinching",state.pinch);
 const wrist=hand[0];targetX=Math.max(-1.25,Math.min(1.25,(.5-state.cursor.x)*2.5));targetY=Math.max(-.85,Math.min(.85,(.5-state.cursor.y)*1.7));
 targetScale=state.pinch?Math.max(.55,Math.min(2.8,.55+((state.pinchRatio-.12)/.31)*2.25)):1;
 if(state.pinchStarted){const el=document.elementFromPoint(x,y);pinchButton=el&&el.closest?el.closest("button[data-gesture-action]"):null}
 if(state.pinchEnded){if(pinchButton&&pinchButton.isConnected){const rect=pinchButton.getBoundingClientRect();if(x>=rect.left&&x<=rect.right&&y>=rect.top&&y<=rect.bottom)pinchButton.click()}pinchButton=null}
 const fingers=Object.entries(state.extended).filter(([k,v])=>v).map(([k])=>k).join(",")||"closed";
 setStatus("● "+state.gesture+" · "+Math.round(state.confidence*100)+"%","#38bdf8");
 metricsEl.textContent="FPS: "+fps+" · GESTURE: "+state.gesture+" · FINGERS: "+fingers+" · PINCH: "+state.pinchRatio.toFixed(2);
}
async function startCamera(){
 if(running)return;hideError();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showError("Браузер дастрасӣ ба камераро дастгирӣ намекунад. Сайтро тавассути HTTPS ё localhost кушоед.");return}
 startBtn.disabled=true;setStatus("● Боркунии муҳаррик…","#38bdf8");
 try{
  await ensureLibraries();
  initScene();stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"user"},width:{ideal:640},height:{ideal:480},frameRate:{ideal:30,max:30}}});
  video.srcObject=stream;await video.play();
  hands=new Hands({locateFile:file=>mediaPipeBase+file});
  hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.55});hands.onResults(onResults);
  running=true;processing=false;lastInference=0;stopBtn.disabled=false;startBtn.textContent="Камера фаъол аст";setStatus("● Камера фаъол — даст нишон диҳед","#38bdf8");
  lastFpsTime=performance.now();frameCount=0;renderLoop.last=0;if(!renderFrameId)renderFrameId=requestAnimationFrame(renderLoop);processFrames();
 }catch(err){
  await stopCamera();const name=err&&err.name||"";let message="Камера фаъол нашуд: "+(err&&err.message||"хатои номаълум");
  if(name==="NotAllowedError"||name==="PermissionDeniedError")message="Иҷозати камера рад шуд. Дар танзимоти браузер барои ин сайт Camera → Allow интихоб кунед.";
  if(name==="NotFoundError"||name==="DevicesNotFoundError")message="Камера ёфт нашуд.";
  if(name==="NotReadableError"||name==="TrackStartError")message="Камераро барномаи дигар истифода мебарад. Он барномаро маҳкам карда, дубора кӯшиш кунед.";
  showError(message);
 }finally{startBtn.disabled=false}
}
async function processFrames(){
 if(!running)return;const now=performance.now();
 if(video.readyState>=HTMLMediaElement.HAVE_CURRENT_DATA&&!processing&&now-lastInference>=33){
  processing=true;lastInference=now;try{await hands.send({image:video})}catch(err){if(running){await stopCamera();showError("Хатои коркарди тасвир: "+(err.message||""))}}finally{processing=false}
 }
 if(running)processFrameId=requestAnimationFrame(processFrames);
}
async function stopCamera(){
 running=false;if(processFrameId){cancelAnimationFrame(processFrameId);processFrameId=0}
 if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}
 video.pause();video.srcObject=null;if(hands){try{await hands.close()}catch(_){}hands=null}
 processing=false;gestureEngine.reset();drawHand(null);cursorEl.style.display="none";cursorEl.classList.remove("pinching");pinchButton=null;targetScale=1;targetX=0;targetY=0;stopBtn.disabled=true;startBtn.textContent="Фаъол кардани камера";
 if(errorEl.style.display==="none"||!errorEl.style.display)setStatus("● Камера хомӯш аст");
}
startBtn.addEventListener("click",startCamera);stopBtn.addEventListener("click",stopCamera);
document.querySelectorAll("button[data-gesture-action]").forEach(button=>button.addEventListener("click",()=>{if(button.dataset.gestureAction==="reset"){targetScale=1;targetX=0;targetY=0}if(button.dataset.gestureAction==="rotate")rotating=!rotating}));
addEventListener("pagehide",()=>{stopCamera();if(renderFrameId){cancelAnimationFrame(renderFrameId);renderFrameId=0}if(renderer){renderer.dispose();renderer=null}});
ensureLibraries().then(()=>{initScene();if(!renderFrameId)renderFrameId=requestAnimationFrame(renderLoop);setStatus("● Омода — камераро фаъол кунед","#38bdf8")}).catch(err=>{showError("Китобхонаҳои графикӣ бор нашуданд. Интернетро санҷед ё саҳифаро нав кунед.\\n"+(err.message||String(err)))})
})();
</script></body></html>
