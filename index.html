<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Hand Zoom</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050510; font-family: sans-serif;
        }
        #webcam {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0.25; transform: scaleX(-1); z-index: 1;
        }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
        }
        #status {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            background: rgba(0,0,0,0.7); color: #00ffcc; padding: 8px 16px;
            border-radius: 20px; font-size: 13px; font-weight: bold;
            border: 1px solid #00ffcc;
        }
        #info {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(0,0,0,0.7); color: #fff;
            padding: 8px 16px; border-radius: 20px; font-size: 13px; text-align: center;
            width: 85%; max-width: 350px; border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="webcam" playsinline webkit-playsinline autoplay muted></video>
    <div id="canvas-container"></div>
    <div id="status">⏳ Интизори даст...</div>
    <div id="info">👌 Ангушти калон ва шаҳодатро наздику дур кунед</div>

    <script>
        const statusEl = document.getElementById('status');
        const videoElement = document.getElementById('webcam');

        // 1. Scene & Render
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Light
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 2);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 1.5));

        // 3D Cube
        const geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const material = new THREE.MeshStandardMaterial({ color: 0x00ffcc, wireframe: false, roughness: 0.3 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 2. MediaPipe logic
        let baseDist = null;

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                const thumb = hand[4];  // Thumb tip
                const index = hand[8];  // Index tip

                // 3D distance
                const dx = thumb.x - index.x;
                const dy = thumb.y - index.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (!baseDist) baseDist = dist;

                // Scale Logic
                let scale = (dist / baseDist) * 1.5;
                scale = Math.max(0.4, Math.min(scale, 3.5)); // Min/Max limit

                cube.scale.set(scale, scale, scale);
                statusEl.innerText = `🔍 Андоза: ${scale.toFixed(1)}x`;
                statusEl.style.color = '#00ffcc';
            } else {
                baseDist = null;
                statusEl.innerText = '🖐️ Даст нишон диҳед';
                statusEl.style.color = '#ffcc00';
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, // 0 - Суръати тез барои телефон
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 480,
            height: 640,
            facingMode: "user"
        });

        cameraUtils.start().then(() => {
            statusEl.innerText = "✅ Камера фаъол";
        }).catch(err => {
            statusEl.innerText = "❌ Иҷозати камера нест";
            statusEl.style.color = "#ff4444";
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
